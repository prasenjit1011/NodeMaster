name: Deploy NutriSoft Lambda

on:
  push:
    branches:
      - nutriapp

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e
          npm ci

      # ---------------------------------------------------------
      # Create Lambda deployment package
      # ---------------------------------------------------------
      - name: Create Lambda ZIP
        run: |
          set -e

          rm -f lambda.zip

          zip -r lambda.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "lambda.zip" \
            -x "node_modules/.cache/*"

          echo "Lambda package created:"
          ls -lh lambda.zip

      # ---------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # ---------------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          set -e
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # Deploy Lambda
      # ---------------------------------------------------------
      - name: Deploy Lambda
        env:
          FUNCTION_NAME: nutrisoft-api
          LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
          AWS_REGION: ap-south-1
          CATEGORY_PATH: /categories
        run: |
          set -e

          echo "=============================================="
          echo "Deploying Lambda: $FUNCTION_NAME"
          echo "Region: $AWS_REGION"
          echo "=============================================="

          # =====================================================
          # CREATE / UPDATE LAMBDA
          # =====================================================

          if aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "Lambda function already exists."

            # ---------------------------------------------------
            # Update Lambda code
            # ---------------------------------------------------
            echo "Updating Lambda code..."

            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://lambda.zip \
              --region "$AWS_REGION"

            echo "Waiting for Lambda code update..."

            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION"

            # ---------------------------------------------------
            # Update Lambda configuration
            # ---------------------------------------------------
            echo "Updating Lambda configuration..."

            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --handler handler.handler \
              --runtime nodejs20.x \
              --timeout 30 \
              --memory-size 512 \
              --region "$AWS_REGION"

            echo "Waiting for Lambda configuration update..."

            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION"

            echo "Lambda configuration updated."

          else

            echo "Lambda function does not exist."

            # ---------------------------------------------------
            # Validate execution role
            # ---------------------------------------------------
            if [ -z "$LAMBDA_ROLE_ARN" ]; then
              echo "ERROR: LAMBDA_ROLE_ARN secret is missing."
              exit 1
            fi

            echo "Creating Lambda function..."

            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs20.x \
              --handler handler.handler \
              --architectures x86_64 \
              --role "$LAMBDA_ROLE_ARN" \
              --zip-file fileb://lambda.zip \
              --timeout 30 \
              --memory-size 512 \
              --region "$AWS_REGION"

            echo "Lambda function created."

            # ---------------------------------------------------
            # Wait until Lambda is active
            # ---------------------------------------------------
            echo "Waiting for Lambda to become active..."

            aws lambda wait function-active \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION"

            echo "Lambda is active."

          fi

          # =====================================================
          # FUNCTION URL
          # =====================================================

          echo ""
          echo "=============================================="
          echo "Configuring Lambda Function URL"
          echo "=============================================="

          if aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "Function URL already exists."

            aws lambda update-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors '{
                "AllowOrigins": ["*"],
                "AllowMethods": ["*"],
                "AllowHeaders": ["*"]
              }' \
              --region "$AWS_REGION"

            echo "Function URL configuration updated."

          else

            echo "Creating Function URL..."

            aws lambda create-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors '{
                "AllowOrigins": ["*"],
                "AllowMethods": ["*"],
                "AllowHeaders": ["*"]
              }' \
              --region "$AWS_REGION"

            echo "Function URL created."

          fi

          # =====================================================
          # GET FUNCTION URL
          # =====================================================

          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'FunctionUrl' \
            --output text)

          echo ""
          echo "Function URL:"
          echo "$FUNCTION_URL"



          # =====================================================
          # PUBLIC FUNCTION URL PERMISSIONS
          # =====================================================

          echo ""
          echo "=============================================="
          echo "Configuring public Function URL permissions"
          echo "=============================================="

          URL_PERMISSION_ID="FunctionURLAllowPublic"
          INVOKE_PERMISSION_ID="FunctionURLInvokePublic"

          # -----------------------------------------------------
          # Get current Lambda resource policy
          # -----------------------------------------------------

          echo "Reading current Lambda resource policy..."

          POLICY=$(aws lambda get-policy \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'Policy' \
            --output text 2>/dev/null || true)

          # =====================================================
          # 1. lambda:InvokeFunctionUrl
          # =====================================================

          echo ""
          echo "Checking lambda:InvokeFunctionUrl permission..."

          if echo "$POLICY" | grep -q "$URL_PERMISSION_ID"; then

            echo "lambda:InvokeFunctionUrl permission already exists."
            echo "Statement ID: $URL_PERMISSION_ID"

          elif echo "$POLICY" | grep -q "FunctionUrlAllowPublic"; then

            echo "Existing public Function URL permission detected."
            echo "No new permission will be created."

          else

            echo "Adding lambda:InvokeFunctionUrl permission..."

            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id "$URL_PERMISSION_ID" \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE \
              --region "$AWS_REGION"

            echo "lambda:InvokeFunctionUrl permission added."

          fi

          # =====================================================
          # Refresh policy after first permission
          # =====================================================

          POLICY=$(aws lambda get-policy \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'Policy' \
            --output text 2>/dev/null || true)

          # =====================================================
          # 2. lambda:InvokeFunction
          # =====================================================

          echo ""
          echo "Checking lambda:InvokeFunction permission..."

          if echo "$POLICY" | grep -q "$INVOKE_PERMISSION_ID"; then

            echo "lambda:InvokeFunction permission already exists."
            echo "Statement ID: $INVOKE_PERMISSION_ID"

          else

            echo "Adding lambda:InvokeFunction permission..."

            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id "$INVOKE_PERMISSION_ID" \
              --action lambda:InvokeFunction \
              --principal "*" \
              --invoked-via-function-url \
              --region "$AWS_REGION"

            echo "lambda:InvokeFunction permission added."

          fi







          # =====================================================
          # VERIFY POLICY
          # =====================================================

          echo ""
          echo "=============================================="
          echo "Lambda resource policy"
          echo "=============================================="

          aws lambda get-policy \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

          # =====================================================
          # VERIFY FUNCTION URL CONFIGURATION
          # =====================================================

          echo ""
          echo "=============================================="
          echo "Function URL configuration"
          echo "=============================================="

          aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

          # =====================================================
          # VERIFY LAMBDA STATUS
          # =====================================================

          echo ""
          echo "=============================================="
          echo "Lambda status"
          echo "=============================================="

          aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'Configuration.[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table

          # =====================================================
          # PRINT API URLS
          # =====================================================

          echo ""
          echo "=============================================="
          echo "NutriSoft API URLs"
          echo "=============================================="

          echo ""
          echo "Base URL:"
          echo "$FUNCTION_URL"

          echo ""
          echo "Category Listing URL:"
          echo "${FUNCTION_URL}${CATEGORY_PATH}"

          # =====================================================
          # TEST FUNCTION URL
          # =====================================================

          echo ""
          echo "=============================================="
          echo "Testing Lambda Function URL"
          echo "=============================================="

          HTTP_STATUS=$(curl \
            -s \
            -o /tmp/lambda-response.txt \
            -w "%{http_code}" \
            "$FUNCTION_URL")

          echo "HTTP Status: $HTTP_STATUS"

          echo ""
          echo "Response:"
          cat /tmp/lambda-response.txt

          echo ""

          # -----------------------------------------------------
          # Only fail for AWS Function URL authorization 403
          # -----------------------------------------------------

          if [ "$HTTP_STATUS" = "403" ]; then
            echo ""
            echo "ERROR: Lambda Function URL returned HTTP 403."
            echo "The Function URL permissions are still incorrect."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "Lambda deployment completed successfully."
          echo "=============================================="